x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: retailpulse-airflow:latest
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: retailpulse-local-dev-secret
    PYTHONPATH: /opt/airflow
    RETAILPULSE_DATA_DIR: /opt/airflow/data
    MLFLOW_TRACKING_URI: http://mlflow:5000
    # Phase 4: raw data bucket on LocalStack (dummy creds; the code refuses real AWS by default)
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_DEFAULT_REGION: us-east-1
    RETAILPULSE_RAW_BUCKET: retailpulse-raw-data
    RETAILPULSE_RAW_SOURCE: auto   # auto | s3 (strict) | local
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
  depends_on:
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-mlflow-db.sql:/docker-entrypoint-initdb.d/init-mlflow-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "mlflow"]
      interval: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    image: retailpulse-mlflow:latest
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://airflow:airflow@postgres/mlflow
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --default-artifact-root mlflow-artifacts:/
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      retries: 10

  # Phase 4: local AWS emulator (S3 only). Pinned Community image: `latest` now requires an
  # account/auth token. Community edition has no persistence -> re-run scripts/upload_raw_data.py
  # after the container is recreated.
  localstack:
    image: localstack/localstack:4.12
    environment:
      SERVICES: s3
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      retries: 10

  # Phase 4: FastAPI inference service for whatever holds the `production` alias on
  # retailpulse-champion. Separate image from Airflow (no torch, no airflow).
  inference-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: retailpulse-api:latest
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      RETAILPULSE_RAW_BUCKET: retailpulse-raw-data
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:$${PORT}/health"]
      interval: 10s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create --username admin --password admin
        --firstname Admin --lastname User --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

volumes:
  postgres-data:
  mlflow-artifacts:
