# Run the inference API the way SageMaker would: the container listens on 8080 and the
# health check uses /ping.
#
#   docker compose -f docker-compose.yml -f docker-compose.sagemaker.yml up -d inference-api
#   curl -i localhost:8081/ping
#
# Host port 8081 -> container port 8080 (host 8080 is the Airflow UI in this stack).
# Back to the normal dev setup (port 8000):  docker compose up -d inference-api
# Local test only - nothing here touches AWS.
services:
  inference-api:
    environment:
      PORT: "8080"
    ports: !override
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:$${PORT}/ping"]
      interval: 10s
      retries: 10
