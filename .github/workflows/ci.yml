# Code CI: runs the test suite on every push / PR.
# Separate concern from the model gate (src/gate.py), which decides model promotion.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dl.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel keeps the install small; no GPU needed for tests
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dl.txt

      - name: Run tests
        # Integration test in test_gate.py auto-skips: no MLflow server in CI.
        run: python -m pytest -q
