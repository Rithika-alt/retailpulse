# Code CI: runs the test suite on every push / PR.
# Separate concern from the model gate (src/gate.py), which decides model promotion.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dl.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel keeps the install small; no GPU needed for tests
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dl.txt -r requirements-api.txt

      - name: Run tests
        # Integration tests (MLflow server, LocalStack) auto-skip: no servers in CI.
        run: python -m pytest -q

  terraform:
    # Syntax/structure check only. Never plan/apply; no AWS credentials exist or are needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra validate
